name: Refresh Profile Telemetry

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update stats-card.svg
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_USER: ${{ github.repository_owner }}
        run: python .github/scripts/update_stats.py
      - name: Commit updated SVG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg
          git diff --cached --quiet || (git commit -m "chore: refresh live telemetry stats" && git push)
