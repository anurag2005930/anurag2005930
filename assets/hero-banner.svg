<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Anurag Patel Profile Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="55%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="cyberGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
    <radialGradient id="glowL" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="85%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }
      @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes barBounce1 { 0%, 100% { transform: scaleY(0.55); } 50% { transform: scaleY(1.15); } }
      @keyframes barBounce2 { 0%, 100% { transform: scaleY(1.1); } 50% { transform: scaleY(0.45); } }
      @keyframes barBounce3 { 0%, 100% { transform: scaleY(0.7); } 50% { transform: scaleY(1.25); } }
      .dotPulse { transform-origin: 62px 41px; animation: pulseDot 2s ease-in-out infinite; }
      .hudSpin { transform-origin: 782px 124px; animation: spinSlow 24s linear infinite; }
      .b1 { transform-box: fill-box; transform-origin: center; animation: barBounce1 1.7s ease-in-out infinite; }
      .b2 { transform-box: fill-box; transform-origin: center; animation: barBounce2 1.4s ease-in-out infinite; }
      .b3 { transform-box: fill-box; transform-origin: center; animation: barBounce3 1.9s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="216" rx="18" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="896" height="216" rx="18" fill="url(#cyberGrid)"/>
  <rect x="2" y="2" width="896" height="216" rx="18" fill="url(#glowL)"/>
  <rect x="2" y="2" width="896" height="216" rx="18" fill="url(#glowR)"/>
  <rect x="2" y="2" width="896" height="216" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.6"/>

  <!-- Top HUD bar -->
  <rect x="46" y="28" width="295" height="26" rx="13" fill="#0f172a" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1"/>
  <circle class="dotPulse" cx="62" cy="41" r="4.5" fill="#22c55e"/>
  <text x="76" y="45" fill="#cbd5e1" font-family="Consolas, 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="0.8">SYSTEMS • AI VISION • CSE UNDERGRAD</text>

  <rect x="630" y="28" width="228" height="26" rx="13" fill="#0f172a" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1"/>
  <text x="744" y="45" text-anchor="middle" fill="#00e5ff" font-family="Consolas, 'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="0.6">@anurag2005930 • PRIMARY LAB</text>

  <!-- Main Heading -->
  <text x="46" y="80" fill="#00e5ff" font-family="Consolas, 'Fira Code', monospace" font-size="12.5" font-weight="700" letter-spacing="2.8">HELLO WORLD, I&apos;M</text>
  <text x="46" y="126" fill="url(#nameGrad)" font-family="Segoe UI, Ubuntu, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Anurag Patel</text>
  <text x="46" y="153" fill="#94a3b8" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14.5" font-weight="500">3rd Year B.Tech CSE Student  •  Building Low-Latency AI, CUDA &amp; Web Telemetry</text>

  <!-- Chips -->
  <g transform="translate(46, 172)"><rect width="152" height="28" rx="14" fill="#161f30" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1"/><text x="76.0" y="18" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600">⚡ CUDA &amp; NVML</text></g><g transform="translate(210, 172)"><rect width="168" height="28" rx="14" fill="#161f30" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1"/><text x="84.0" y="18" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600">🧠 MediaPipe Edge AI</text></g><g transform="translate(390, 172)"><rect width="152" height="28" rx="14" fill="#161f30" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1"/><text x="76.0" y="18" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600">🏆 Galaxy Brain x4</text></g>

  <!-- Right animated telemetry ring & wave bars -->
  <g opacity="0.9">
    <circle cx="782" cy="124" r="56" fill="none" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle class="hudSpin" cx="782" cy="124" r="46" fill="none" stroke="#00e5ff" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="14 8 4 8"/>
    <circle cx="782" cy="124" r="35" fill="#0d1117" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="1.2"/>
    <rect class="b1" x="761" y="114" width="6" height="24" rx="3" fill="#00e5ff"/>
    <rect class="b2" x="771" y="106" width="6" height="34" rx="3" fill="#38bdf8"/>
    <rect class="b3" x="781" y="110" width="6" height="28" rx="3" fill="#ffffff"/>
    <rect class="b2" x="791" y="108" width="6" height="32" rx="3" fill="#7c3aed"/>
    <rect class="b1" x="801" y="116" width="6" height="22" rx="3" fill="#00e5ff"/>
  </g>
</svg>